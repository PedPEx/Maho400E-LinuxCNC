[EMC]
VERSION = 1.1

[DISPLAY]
DISPLAY = axis
MAX_LINEAR_VELOCITY = 1

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[RS274NGC]
# NoneType object has no attribute 'rfind'
PARAMETER_FILE = sim.var

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100

[EMCMOT]
EMCMOT = motmod
SERVO_PERIOD = 1000000

[HAL]
HALFILE = Maho_3_axes.hal

# NOTE: Must have consistent values for
# [TRAJ]COORDINATES = LETTERS
# [KINS]JOINTS      = Number_of_JOINTs
# [KINS]KINEMAITICS = trivkins coordinates=LETTERS

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree

[KINS]
JOINTS = 3
KINEMATICS = trivkins coordinates=XYZ

# =========================================
# Achse X
# =========================================
[AXIS_X]
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 500.0

[JOINT_0]
TYPE = LINEAR
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 20.0
HOME_LATCH_VEL = 1.0

# PID Parameter
P = 10.0
I = 0.0
D = 0.1
FF0 = 0.0
FF1 = 1.0
FF2 = 0.0
DEADBAND = 0.005
MAX_OUTPUT = 10.0

# Skalierung
# OUTPUT_SCALE: Entspricht meist der Maximalspannung (z.B. 10V für EL4034)
OUTPUT_SCALE = 10.0
# ENCODER_SCALE: Inkremente des Encoders pro Millimeter Verfahrweg
ENCODER_SCALE = 1000.0

# Schleppfehler-Limits (Closed Loop)
FERROR = 1.0
MIN_FERROR = 0.1


# =========================================
# Achse Y
# =========================================
[AXIS_Y]
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 500.0

[JOINT_1]
TYPE = LINEAR
HOME_SEQUENCE = 1
HOME_SEARCH_VEL = 20.0
HOME_LATCH_VEL = 1.0

# PID Parameter
P = 10.0
I = 0.0
D = 0.1
FF0 = 0.0
FF1 = 1.0
FF2 = 0.0
DEADBAND = 0.005
MAX_OUTPUT = 10.0

# Skalierung
OUTPUT_SCALE = 10.0
ENCODER_SCALE = 1000.0

# Schleppfehler-Limits (Closed Loop)
FERROR = 1.0
MIN_FERROR = 0.1


# =========================================
# Achse Z
# =========================================
[AXIS_Z]
MAX_VELOCITY = 50.0
MAX_ACCELERATION = 250.0

[JOINT_2]
TYPE = LINEAR
HOME_SEQUENCE = 2
HOME_SEARCH_VEL = 10.0
HOME_LATCH_VEL = 1.0

# PID Parameter
P = 15.0
I = 0.0
D = 0.1
FF0 = 0.0
FF1 = 1.0
FF2 = 0.0
DEADBAND = 0.005
MAX_OUTPUT = 10.0

# Skalierung
OUTPUT_SCALE = 10.0
ENCODER_SCALE = 1000.0

# Schleppfehler-Limits (Closed Loop)
FERROR = 1.0
MIN_FERROR = 0.1